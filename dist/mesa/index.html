    <!-- Modo totem aplicado aqui, antes de qualquer pintura: navegadores
         embutidos antigos (painéis Android) às vezes ignoram a troca da meta
         viewport feita depois que a página já carregou. Mesma regra de
         src/mesa/totem.ts: ?totem=1 liga e fica guardado, ?totem=0 desliga.
         Além disso o painel do totem (iiyama ProLite TF....) é reconhecido
         pelo modelo e liga sozinho — trocar de navegador ou limpar os dados
         não derruba mais o layout. -->
    <script>
      (function () {
        var PANEL = /\bTF\d{4}[A-Z]{0,3}\b/ // modelos iiyama ProLite TF (ex.: TF3239AS-B1AG)
        var p = /[?&]totem=([01])/.exec(location.search)
        var off = false
        var on = false
        try {
          if (p && p[1] === '1') localStorage.setItem('mesa:totem', '1')
          if (p && p[1] === '0') localStorage.setItem('mesa:totem', '0')
          var saved = localStorage.getItem('mesa:totem')
          on = saved === '1'
          off = saved === '0'
        } catch (e) {
          on = !!(p && p[1] === '1')
          off = !!(p && p[1] === '0')
        }
        // Opera e navegadores antigos mandam o modelo no user agent.
        if (!on && !off && PANEL.test(navigator.userAgent)) on = true

        function apply() {
          document.documentElement.setAttribute('data-totem', '')
          var m = document.querySelector('meta[name="viewport"]')
          if (m) m.setAttribute('content', 'width=1080, user-scalable=no, viewport-fit=cover')
        }
        if (on) {
          apply()
          try { localStorage.setItem('mesa:totem', '1') } catch (e) {}
          return
        }
        if (off) return

        // Chrome esconde o modelo no user agent, mas o entrega se pedido. Como a
        // resposta chega depois da página começar, grava e recarrega uma vez.
        var uad = navigator.userAgentData
        if (uad && uad.getHighEntropyValues) {
          uad.getHighEntropyValues(['model']).then(function (d) {
            if (!PANEL.test(d.model || '')) return
            try {
              if (sessionStorage.getItem('mesa:totem-reload')) return
              sessionStorage.setItem('mesa:totem-reload', '1')
              localStorage.setItem('mesa:totem', '1')
              location.reload()
            } catch (e) {
              apply()
            }
          }, function () {})
        }
      })()
    </script>
