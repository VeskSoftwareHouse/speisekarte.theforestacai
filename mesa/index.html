<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Modo totem aplicado aqui, antes de qualquer pintura: navegadores
         embutidos antigos (painéis Android) às vezes ignoram a troca da meta
         viewport feita depois que a página já carregou. Mesma regra de
         src/mesa/totem.ts: ?totem=1 liga e fica guardado, ?totem=0 desliga. -->
    <script>
      (function () {
        var p = /[?&]totem=([01])/.exec(location.search)
        var on = false
        try {
          if (p && p[1] === '1') localStorage.setItem('mesa:totem', '1')
          if (p && p[1] === '0') localStorage.removeItem('mesa:totem')
          on = localStorage.getItem('mesa:totem') === '1'
        } catch (e) {
          on = !!(p && p[1] === '1')
        }
        if (!on) return
        document.documentElement.setAttribute('data-totem', '')
        var m = document.querySelector('meta[name="viewport"]')
        if (m) m.setAttribute('content', 'width=1080, user-scalable=no, viewport-fit=cover')
      })()
    </script>
    <title>Cardápio Faça seu Pedido</title>
    <meta name="description" content="Cardápio digital da mesa: navegue, monte seu pedido e envie para a cozinha." />
    <meta name="theme-color" content="#17121f" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Caveat, Fredoka, Playfair Display e Space Mono existem só para a frase
         da sidebar, que reescreve a si mesma trocando de idioma e de fonte.
         Um peso de cada, para não pesar o carregamento à toa. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Caveat:wght@700&family=Fredoka:wght@500&family=Playfair+Display:ital,wght@1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/mesa/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cardápio" />
    <link rel="apple-touch-icon" href="/mesa/icons/icon-192.png" />
    <link rel="icon" href="/mesa/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mesa/main.tsx"></script>
  </body>
</html>
